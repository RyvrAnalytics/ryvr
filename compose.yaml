# RYVR self-hosted stack. Copy .env.production.example to .env, fill it in, then:
#   docker compose up -d
#   docker compose exec app php artisan ryvr:migrate --force   (first run; later runs migrate on start)
# Fits a 4 GB machine; 8 GB recommended for busy sites.
name: ryvr

x-app: &app
    build:
        context: .
        target: app
    image: ryvr/app:local
    restart: unless-stopped
    env_file: ${RYVR_ENV_FILE:-.env}
    environment:
        DB_HOST: postgres
        DB_PORT: 5432
        REDIS_HOST: redis
        REDIS_PORT: 6379
        CLICKHOUSE_URL: http://clickhouse:8123
    volumes:
        - storage:/app/storage
    depends_on:
        postgres: { condition: service_healthy }
        redis: { condition: service_healthy }
        clickhouse: { condition: service_healthy }

services:
    web:
        build:
            context: .
            target: web
        image: ryvr/web:local
        restart: unless-stopped
        ports:
            - '${RYVR_HTTP_PORT:-80}:80'
            - '${RYVR_HTTPS_PORT:-443}:443'
            - '${RYVR_HTTPS_PORT:-443}:443/udp'
        environment:
            RYVR_DOMAIN: ${RYVR_DOMAIN:-:80}
            ACME_EMAIL: ${ACME_EMAIL:-}
        volumes:
            - caddy_data:/data
            - caddy_config:/config
        depends_on: [app]

    app:
        <<: *app
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CLICKHOUSE_URL: http://clickhouse:8123
            RYVR_RUN_MIGRATIONS: 'true'

    # Moves buffered hits from Redis into ClickHouse.
    writer:
        <<: *app
        command: ['php', 'artisan', 'ryvr:ingest:work']

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']

    queue:
        <<: *app
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--sleep=3',
                '--tries=3',
                '--max-time=3600',
            ]

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-ryvr}
            POSTGRES_USER: ${DB_USERNAME:-ryvr}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes: [pgdata:/var/lib/postgresql]
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ryvr}']
            interval: 5s
            retries: 20

    clickhouse:
        image: clickhouse/clickhouse-server:25.8
        restart: unless-stopped
        environment:
            CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-ryvr}
            CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-ryvr}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        volumes:
            - chdata:/var/lib/clickhouse
            - ./docker/clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
        ulimits:
            nofile: { soft: 262144, hard: 262144 }
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8123/ping']
            interval: 5s
            retries: 30

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command:
            [
                'redis-server',
                '--appendonly',
                'yes',
                '--maxmemory-policy',
                'noeviction',
            ]
        volumes: [redisdata:/data]
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            retries: 20

volumes:
    storage: {}
    pgdata: {}
    chdata: {}
    redisdata: {}
    caddy_data: {}
    caddy_config: {}
