name: Bug report
description: Report a problem with RYVR.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting a bug. Remove secrets and personal data from anything you share.
        For security issues, follow [Security](https://github.com/RyvrAnalytics/ryvr/blob/main/SECURITY.md) and report privately.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release or commit are you running?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the affected page or component.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, browser and relevant component versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add relevant details with secrets and personal data removed.
